version: "3"

services:
  web:
    build: .
    image: meow
    command: honcho start -f Procfile.dev
    entrypoint: ./entrypoint.sh
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/meow
    environment:
      PYTHONUNBUFFERED: 1
      PORT: ${PORT:-5000}
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: example
  redis:
    image: redis:alpine
